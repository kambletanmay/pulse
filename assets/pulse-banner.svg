<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>

    <!-- Audio waveform path -->
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="20%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="80%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="#000000"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#bgGlow)"/>

  <!-- Scanlines -->
  <g opacity="0.04">
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#a855f7" stroke-width="1"/>
  </g>

  <!-- Top status bar -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#71717a" letter-spacing="4">
    <text x="60" y="40">[ STREAMING.INTELLIGENCE ]</text>
    <text x="1140" y="40" text-anchor="end">v1.0 · NEURAL MARKET TERMINAL</text>
  </g>

  <!-- Corner brackets -->
  <g stroke="#a855f7" stroke-width="2" fill="none">
    <path d="M 40 60 L 40 80 L 60 80"/>
    <path d="M 1160 60 L 1160 80 L 1140 80"/>
    <path d="M 40 300 L 40 280 L 60 280"/>
    <path d="M 1160 300 L 1160 280 L 1140 280"/>
  </g>

  <!-- Animated waveform behind title -->
  <g opacity="0.5">
    <path d="M 100 180 Q 200 160 250 180 T 350 180 T 450 180 T 550 180 T 650 180 T 750 180 T 850 180 T 950 180 T 1050 180 T 1100 180"
          stroke="url(#wave)" stroke-width="1.5" fill="none">
      <animate attributeName="d"
        dur="4s"
        repeatCount="indefinite"
        values="
          M 100 180 Q 200 160 250 180 T 350 180 T 450 180 T 550 180 T 650 180 T 750 180 T 850 180 T 950 180 T 1050 180 T 1100 180;
          M 100 180 Q 200 200 250 180 T 350 175 T 450 185 T 550 170 T 650 190 T 750 175 T 850 185 T 950 175 T 1050 180 T 1100 180;
          M 100 180 Q 200 160 250 180 T 350 180 T 450 180 T 550 180 T 650 180 T 750 180 T 850 180 T 950 180 T 1050 180 T 1100 180
        "/>
    </path>
  </g>

  <!-- Decorative diamond mark -->
  <g transform="translate(180, 180)">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="#a855f7" stroke-width="2" transform="rotate(45)"/>
    <rect x="-22" y="-22" width="44" height="44" fill="#a855f7" fill-opacity="0.1" transform="rotate(45)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#a855f7">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- MAIN TITLE -->
  <text x="600" y="200" text-anchor="middle"
        font-family="'Impact', 'Arial Black', sans-serif"
        font-size="140"
        font-weight="900"
        fill="url(#titleGrad)"
        letter-spacing="20"
        filter="url(#glow)">PULSE</text>

  <!-- Title outline echo -->
  <text x="600" y="200" text-anchor="middle"
        font-family="'Impact', 'Arial Black', sans-serif"
        font-size="140"
        font-weight="900"
        fill="none"
        stroke="#a855f7"
        stroke-width="1"
        stroke-opacity="0.4"
        letter-spacing="20"
        transform="translate(3, 3)">PULSE</text>

  <!-- Subtitle -->
  <text x="600" y="240" text-anchor="middle"
        font-family="'Courier New', monospace"
        font-size="14"
        fill="#c084fc"
        letter-spacing="8">PREDICTIVE · UNIFIED · LISTENING · STREAMING · ENGINE</text>

  <!-- Accent line under subtitle -->
  <line x1="300" y1="260" x2="900" y2="260" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Bottom data strip -->
  <g font-family="'Courier New', monospace" font-size="11" letter-spacing="3">
    <text x="60" y="320" fill="#71717a">▸ TRACKS</text>
    <text x="140" y="320" fill="#a855f7">2,500</text>
    <text x="220" y="320" fill="#71717a">▸ STREAMS</text>
    <text x="310" y="320" fill="#22d3ee">2.34T</text>
    <text x="380" y="320" fill="#71717a">▸ STATUS</text>
    <text x="460" y="320" fill="#34d399">● NOMINAL</text>
    <text x="1140" y="320" fill="#71717a" text-anchor="end">EST.2026 · CYBER-NOIR</text>
  </g>

  <!-- Pulsing dots in corners -->
  <circle cx="60" cy="180" r="3" fill="#a855f7">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1140" cy="180" r="3" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
